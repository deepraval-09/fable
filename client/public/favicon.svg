<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient for the middle folded bar -->
    <linearGradient id="midGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0000" />
      <stop offset="40%" stop-color="#880000" />
      <stop offset="100%" stop-color="#ff0000" />
    </linearGradient>
    
    <!-- Gradient for the main swooping stem to create the 3D shadow illusion -->
    <linearGradient id="mainGrad" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="40%" stop-color="#3a0000" />
      <stop offset="70%" stop-color="#ff0000" />
      <stop offset="100%" stop-color="#ff3333" />
    </linearGradient>
  </defs>
  
  <!-- Black App Icon Background -->
  <rect width="100" height="100" rx="20" fill="#030303" />
  
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Middle Bar (Tucked Behind) -->
    <path d="M 15 50 L 80 50 L 63 72 L 10 72 Z" fill="url(#midGrad)" />
    
    <!-- Main Stem & Top Bar (Foreground) -->
    <path d="M 10 90 C 15 40, 35 12, 95 10 L 72 40 L 45 40 L 32 90 Z" fill="url(#mainGrad)" />
  </g>
</svg>